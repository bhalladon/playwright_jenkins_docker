name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      WEB_BROWSER:
        description: 'Select a web browser'
        required: true
        default: 'chrome'
        type: choice
        options: [ chrome, firefox, edge ]

      TEST_TYPE:
        description: 'Select test suite'
        required: true
        default: 'ALL'
        type: choice
        options: [ ALL, UI, API ]

      PYTEST_MARKER:
        description: 'Enter pytest marker expression (e.g., smoke, regression, api, ui")'
        required: false
        default: ''
        type: string

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      WEB_BROWSER: ${{ github.event.inputs.WEB_BROWSER || 'chrome' }}
      APP_URL: ${{ secrets.APP_URL }}
      HEADLESS: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install chromium firefox --with-deps

      - name: Run tests
        run: python -m pytest tests/ --tb=short -v --alluredir=allure-results

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png

